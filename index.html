<title>elos — um espaço para nós</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Sem login autorizado, o app não aparece. */
  body:not(.signed-in) aside, body:not(.signed-in) .shell { display: none; }
  .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center; }
  .login-card { max-width: 360px; width: 100%; }
  .login-card h1 { font-family: Georgia, serif; color: #31594e; font-weight: 400; font-size: 2rem; margin: 0 0 8px; }
  .login-card p { color: #5b625e; line-height: 1.5; }
  .login-card button { margin-top: 16px; padding: 12px 20px; border-radius: 999px; border: 0; background: #31594e; color: #fff; font-size: 1rem; cursor: pointer; }
  #login-msg { min-height: 1.5em; color: #9a3b2e; font-size: .9rem; }
</style>
</head>
<body>
<section id="login" class="login-screen">
  <div class="login-card">
    <h1>elos</h1>
    <p>Um espaço para nós dois. Entre com a conta Google autorizada para acessar.</p>
    <button id="login-btn" type="button">Entrar com Google</button>
    <p id="login-msg" role="status"></p>
  </div>
</section>
